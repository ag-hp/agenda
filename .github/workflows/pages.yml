name: Publicar Agenda en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'agenda/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar la portada de la agenda
        run: |
          cp -R agenda/web _site
          mv _site/index.html _site/local.html
          sed 's/Versión de prueba con guardado de notas y eventos por cuenta./Guarda tus notas, eventos y libros en tu cuenta./' agenda/web/prueba-cuentas.html > _site/index.html
          cat > _site/prueba-cuentas.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <meta charset="utf-8">
          <title>Agenda</title>
          <script>location.replace('./' + location.search + location.hash);</script>
          <a href="./">Abrir la agenda</a>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
